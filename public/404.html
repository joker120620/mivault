<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Archivo no encontrado | MyVault</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #faf9fb;
            color: #332244;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(74, 20, 140, 0.05);
            border: 1px solid rgba(74, 20, 140, 0.05);
        }

        .error-code {
            font-size: 100px;
            font-weight: 800;
            color: #4A148C;
            line-height: 1;
            margin-bottom: 10px;
            letter-spacing: -2px;
        }

        .icon-container {
            margin: 20px 0;
            color: #7B1FA2;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1A0033;
            margin-bottom: 15px;
        }

        p {
            font-size: 16px;
            color: #665577;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background-color: #4A148C;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 30px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(74, 20, 140, 0.2);
        }

        .btn:hover {
            background-color: #300066;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="error-code">404</div>

        <div class="icon-container">
            <!-- Icono de candado / enlace roto en SVG plano -->
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
            </svg>
        </div>

        <h1>Acceso Denegado / No Encontrado</h1>
        <p>El archivo que estás intentando buscar no existe o no tienes los permisos necesarios para verlo directamente
            desde aquí.</p>

        <a href="/sources/dashboard.html" class="btn">Volver a MyVault</a>
    </div>

</body>

</html>
